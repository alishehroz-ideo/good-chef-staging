<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!-- viewport-fit=cover fills the notch area; user-scalable=no kills pinch-zoom,
         which otherwise fights the game's own touch handling. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0E1412">

    <title>Good Chef - Cooking Games</title>

    <style>
      /* ===== Good Chef — mobile landscape template =====
         Self-contained: no TemplateData/style.css dependency, because Unity
         regenerates that file on every build and it would fight these rules. */

      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #0E1412;
        /* Stop iOS rubber-band scroll and Android pull-to-refresh eating drags. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      #unity-container { position: fixed; inset: 0; background: #0E1412; }

      /* The game handles its own aspect via CameraFit, so the canvas fills the
         viewport rather than letterboxing to a fixed ratio. On a 19.5:9 phone
         that means no black bars. */
      #unity-canvas {
        display: block;
        width: 100%; height: 100%;
        background: transparent;
        outline: none;
      }

      /* ---- loading ---- */
      #loading {
        position: absolute; inset: 0; z-index: 10;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #0E1412;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #loading-title {
        color: #F3EFE6; font-size: 17px; font-weight: 600; letter-spacing: 0.02em;
      }
      #bar-track {
        width: min(62vw, 320px); height: 12px;
        background: #23302B; border-radius: 6px; overflow: hidden;
      }
      #bar-fill {
        width: 0%; height: 100%;
        background: linear-gradient(90deg, #E2A33C, #E9C46A);
        border-radius: 6px; transition: width 0.15s ease;
      }
      #bar-pct { color: #8FA39A; font-size: 13px; font-variant-numeric: tabular-nums; }
      #loading-hint { color: #6E817A; font-size: 12px; max-width: 70vw; text-align: center; }

      /* ---- rotate-to-landscape gate ---- */
      #rotate {
        position: fixed; inset: 0; z-index: 40;
        display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        background: #0E1412; text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      #rotate svg { width: 74px; height: 74px; animation: tip 2s ease-in-out infinite; }
      @keyframes tip {
        0%, 45%   { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (prefers-reduced-motion: reduce) { #rotate svg { animation: none; transform: rotate(-90deg); } }
      #rotate p { color: #F3EFE6; font-size: 16px; font-weight: 600; margin: 0; }
      #rotate small { color: #6E817A; font-size: 13px; }

      /* Only gate on touch devices in portrait — a narrow desktop window shouldn't be blocked. */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }

      /* ---- tap-to-start (needed for fullscreen + orientation lock gestures) ---- */
      #start {
        position: fixed; inset: 0; z-index: 30;
        display: none;
        align-items: center; justify-content: center;
        background: rgba(14, 20, 18, 0.94);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #start button {
        appearance: none; border: 0; cursor: pointer;
        background: #E2A33C; color: #1A1410;
        font-size: 17px; font-weight: 700; letter-spacing: 0.02em;
        padding: 16px 40px; border-radius: 8px;
      }
      #start button:focus-visible { outline: 3px solid #F3EFE6; outline-offset: 3px; }

      #warning {
        position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
        z-index: 50; display: none;
        background: #fff; color: #111; padding: 8px 12px; border-radius: 4px;
        font: 13px/1.4 sans-serif; max-width: 90vw;
      }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="loading">
        <div id="loading-title">Good Chef - Cooking Games</div>
        <div id="bar-track"><div id="bar-fill"></div></div>
        <div id="bar-pct">0%</div>
        <div id="loading-hint">First load is large — later visits are cached.</div>
      </div>

      <div id="warning"></div>
    </div>

    <div id="rotate">
      <svg viewBox="0 0 24 24" fill="none" stroke="#E2A33C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="2" width="10" height="20" rx="2"></rect>
        <line x1="11" y1="18.5" x2="13" y2="18.5"></line>
      </svg>
      <p>Rotate your device</p>
      <small>Good Chef is played in landscape</small>
    </div>

    <div id="start"><button type="button" id="start-btn">Tap to play</button></div>

    <script>
      var canvas   = document.querySelector("#unity-canvas");
      var isTouch  = window.matchMedia("(pointer: coarse)").matches;


      function setProgress(p) {
        var pct = Math.round(p * 100);
        document.querySelector("#bar-fill").style.width = pct + "%";
        document.querySelector("#bar-pct").textContent  = pct + "%";
      }

      function unityShowBanner(msg, type) {
        var el = document.querySelector("#warning");
        el.textContent = msg;
        el.style.display = "block";
        if (type !== "error") setTimeout(function () { el.style.display = "none"; }, 5000);
      }

      // Mobile browser chrome (URL bar) changes the viewport on scroll/rotate.
      // visualViewport reports the true drawable area; window.innerHeight lies on iOS.
      function fitCanvas() {
        var vv = window.visualViewport;
        var w  = Math.round(vv ? vv.width  : window.innerWidth);
        var h  = Math.round(vv ? vv.height : window.innerHeight);
        canvas.style.width  = w + "px";
        canvas.style.height = h + "px";
      }
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", function () { setTimeout(fitCanvas, 250); });
      if (window.visualViewport) window.visualViewport.addEventListener("resize", fitCanvas);
      fitCanvas();

      // Fullscreen + orientation lock both require a user gesture, and lock() only
      // works while fullscreen on Android Chrome. iOS Safari supports neither — the
      // CSS rotate gate is the fallback there.
      function enterLandscape() {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        var p = req ? req.call(el) : null;
        Promise.resolve(p)
          .then(function () {
            if (screen.orientation && screen.orientation.lock) return screen.orientation.lock("landscape");
          })
          .catch(function () { /* unsupported — the rotate gate covers it */ });
      }

      var buildUrl  = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Multi Touch Studios",
        productName: "Good Chef - Cooking Games",
        productVersion: "1.9",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: true
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, setProgress).then(function (unityInstance) {
          window.unityInstance = unityInstance;
          setProgress(1);

          var l = document.querySelector("#loading");
          if (l && l.parentNode) l.parentNode.removeChild(l);

          fitCanvas();

          // On touch devices, offer one tap that goes fullscreen and locks landscape.
          if (isTouch) {
            var gate = document.querySelector("#start");
            gate.style.display = "flex";
            document.querySelector("#start-btn").addEventListener("click", function () {
              enterLandscape();
              gate.style.display = "none";
              setTimeout(fitCanvas, 300);
            }, { once: true });
          }
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
